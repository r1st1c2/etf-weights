name: Update holdings matrix

on:
  schedule:
    - cron: "0 6 3 * *"   # 3. u mesecu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python fetch_holdings.py
      - run: python lookthrough.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add holdings_matrix.csv
          git diff --cached --quiet || (git commit -m "Update holdings matrix" && git pull --rebase -X theirs && git push)
